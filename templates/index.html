<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage student records using Flask and SQLite</p>
</header>

<main class="container">

    <section class="card">
        <h2 id="form-title">Add Student</h2>

        <form id="student-form">
            <input type="hidden" id="student-id">

            <div class="form-grid">
                <div>
                    <label>Student Name</label>
                    <input type="text" id="name" placeholder="Enter name" required>
                </div>

                <div>
                    <label>Roll Number</label>
                    <input type="text" id="roll_no" placeholder="Enter roll number" required>
                </div>

                <div>
                    <label>Class</label>
                    <input type="text" id="student_class" placeholder="e.g. BTech CSE" required>
                </div>

                <div>
                    <label>Marks</label>
                    <input type="number" id="marks" min="0" max="100" step="0.01"
                           placeholder="0 - 100" required>
                </div>

                <div>
                    <label>Contact</label>
                    <input type="text" id="contact" maxlength="10"
                           placeholder="10 digit number" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="submit-btn">Add Student</button>
                <button type="button" id="cancel-btn" class="secondary hidden">
                    Cancel Edit
                </button>
            </div>

            <p id="message"></p>
        </form>
    </section>

    <section class="card">
        <div class="list-header">
            <div>
                <h2>Student Records</h2>
                <p id="student-count">0 students</p>
            </div>

            <input type="text" id="search"
                   placeholder="Search by name or roll number...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Class</th>
                        <th>Marks</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-table">
                    <tr>
                        <td colspan="7" class="empty">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
